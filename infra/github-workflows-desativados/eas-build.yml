name: EAS build

# Build do app no EAS, disparado à mão (Actions → EAS build → Run workflow). O job só envia o
# projeto e sai (`--no-wait`); o andamento e o link de instalação ficam em expo.dev.
# Pré-requisitos (apps/mobile/README.md, "Build (EAS)"): secret EXPO_TOKEN e as variáveis
# EAS_PROJECT_ID e EXPO_OWNER do repositório; credenciais de assinatura já criadas no EAS.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Plataforma
        type: choice
        options:
          - android
          - ios
          - all
        default: android
      profile:
        description: Perfil do apps/mobile/eas.json
        type: choice
        options:
          - preview
          - production
        default: preview

concurrency:
  group: ${{ github.workflow }}-${{ inputs.profile }}-${{ inputs.platform }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: EAS build (${{ inputs.profile }}, ${{ inputs.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # O EXPO_TOKEN não fica no env do job: só os passos que precisam dele o recebem.
    env:
      # Lidas pelo app.config.ts (`extra.eas.projectId` e `owner`).
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      EXPO_OWNER: ${{ vars.EXPO_OWNER }}
      PLATFORM: ${{ inputs.platform }}
      PROFILE: ${{ inputs.profile }}
    steps:
      - name: Conferir o EXPO_TOKEN e o projeto do EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error title=EXPO_TOKEN ausente::Crie o secret EXPO_TOKEN (Settings → Secrets and variables → Actions) com um token de acesso do Expo (expo.dev → Access tokens). Veja apps/mobile/README.md, seção Build (EAS)."
            exit 1
          fi
          if [ -z "$EAS_PROJECT_ID" ]; then
            echo "::error title=EAS_PROJECT_ID ausente::Crie a variável EAS_PROJECT_ID (Settings → Secrets and variables → Actions → Variables) com o id do projeto no EAS. Veja apps/mobile/README.md, seção Build (EAS)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # O eas-cli avalia o app.config.ts e os config plugins, que vêm do node_modules do app.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: eas build
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive --no-wait
