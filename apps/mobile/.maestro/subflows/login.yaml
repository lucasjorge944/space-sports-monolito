# RF-AUTH: entra com e-mail e senha (usuário do seed de teste). Parte do app zerado.
appId: ${APP_ID}
---
- clearState
# O Maestro dá todas as permissões por padrão; sem localização a busca não usa raio (os espaços do
# seed não têm coordenadas) e a ordem padrão é "Por nome".
- launchApp:
    clearState: true
    permissions:
      location: deny
# Primeiro acesso: onboarding da permissão de localização (a busca funciona sem ela).
- runFlow:
    when:
      visible:
        id: "localizacao-agora-nao"
    commands:
      - tapOn:
          id: "localizacao-agora-nao"
# Sem sessão, o app cai na tela de entrada.
- assertVisible:
    id: "login-titulo"
# Logo vertical da marca nas telas de auth (acessível como "Space Sports").
- assertVisible:
    id: "auth-logo"
- tapOn:
    id: "login-email"
- inputText: ${PLAYER_EMAIL}
- tapOn:
    id: "login-senha"
- inputText: ${PLAYER_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-entrar"
# No app atual o onboarding da localização abre depois do login (primeiro acesso): espera a tela
# assentar e trata se aparecer.
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible:
        id: "localizacao-agora-nao"
    commands:
      - tapOn:
          id: "localizacao-agora-nao"
# Logo horizontal e sino no cabeçalho fixo das abas.
- assertVisible:
    id: "explorar-logo"
- assertVisible:
    id: "notificacoes-sino"
